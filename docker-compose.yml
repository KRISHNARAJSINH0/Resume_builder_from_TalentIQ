version: '3.8'
services:
  backend:
    build: {context: ./backend, dockerfile: ../docker/Dockerfile.backend}
    ports: ["8000:8000"]
    env_file: ./backend/.env
    depends_on: [db]
    volumes: [./backend:/app]
  frontend:
    build: {context: ./frontend, dockerfile: ../docker/Dockerfile.frontend}
    ports: ["5173:80"]
    depends_on: [backend]
  db:
    image: postgres:16
    environment: {POSTGRES_DB: talentiq, POSTGRES_USER: admin, POSTGRES_PASSWORD: secret}
    ports: ["5432:5432"]
